<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="عربيتي - حلول متكاملة لخدمة سيارتك: صيانة وإصلاح، مساعدة طارئة على الطريق 24/7، فحص، ونش، غسيل وعناية، ومتجر قطع غيار وإكسسوارات. 3arabety - your complete car service solution."
    />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>عربيتي | 3arabety</title>
    <script>
      // Apply the saved language before React renders to avoid a layout flash.
      (function () {
        try {
          var lang = localStorage.getItem('3arabety.lang');
          if (lang === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
            document.title = '3arabety | Car Services & Parts';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app. / يجب تفعيل JavaScript لتشغيل الموقع.</noscript>
    <div id="root"></div>
  </body>
</html>
